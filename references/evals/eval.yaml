description: "Run OSINT research on a person, company, or organization: name, email, employer → tiered sweep → profile extraction → cross-site correlation → recursive handle expansion → domain checks → brief"
version: "1.0.0"
tasks:
  - name: "Person research with correlation"
    input: "Research the CEO of Wikimedia Foundation"
    expected: "A brief with the verified CEO identity, cross-site correlation clusters (minimum 2 sites sharing name/avatar/bio signals), and domain check for their primary domain"
    rubric:
      - "Mentions the verified CEO by name"
      - "Includes at least 2 data points per claimed identity (2+ sources)"
      - "If correlation ran: reports clusters or explicitly states no clusters found"
      - "If domain check ran: reports registration/live status for the subject's domain"
      - "Cites at least one primary source (official site, major news)"
      - "Provenance: every identity claim is tied to a cited source"
      - "If no correlation found: does not assert single-source identity"
    source: "scout"
  - name: "Profile extraction from URL"
    input: "Extract the profile at https://github.com/indigokarasu"
    expected: "Structured profile with name_from_profile true (OG or JSON-LD), bio, and avatar URL"
    rubric:
      - "Returns a profile with name, bio, avatar fields"
      - "name_from_profile is true (structured source, not title fallback)"
      - "Avatar URL starts with https"
      - "sources map shows which extraction source was used"
      - "If avatar URL is private/loopback: not fetched"
  - name: "Correlation: two same-person profiles"
    input: "Two Found profiles carrying the same structured name and a shared link in bio"
    expected: "One cluster of size 2 with strength high or medium"
    rubric:
      - "Reports a cluster of size >= 2"
      - "Cluster signals include name or link"
      - "Edge records which signals joined the pair"
  - name: "Correlation: botwall profile filtered"
    input: "A research result containing a botwall profile (title is a brand name)"
    expected: "Profile present but name_from_profile is false; title not asserted as verified identity"
    rubric:
      - "Profile extracted with name_from_profile: false"
      - "Name is not presented as a verified identity in summary"
      - "Name came from title_fallback or meta_description"
  - name: "Domain check: existing handle"
    input: "Check whether a known handle has a web presence"
    expected: "Reports which TLDs are registered and live"
    rubric:
      - "Tests at least 3 TLDs"
      - "Reports registered and live status per TLD"
      - "No whois API or API key required (stdlib DNS+HTTP)"
  - name: "Recursive expansion: pass 1"
    input: "A research result with 2+ Found profiles carrying bios containing handles"
    expected: "New handle candidates from bios, pass=2, each with sources and confidence"
    rubric:
      - "Candidates have pass=2"
      - "Each candidate has sources (which site found it)"
      - "Corroborated flag set for candidates seen in 2+ sites"
  - name: "Recursive expansion: cap enforced"
    input: "Request to expand from pass 2"
    expected: "Refused with recursion_cap error and actionable guidance to finish"
    rubric:
      - "refused is true"
      - "error mentions recursion cap"
      - "actionable_guidance instructs to apply identity gate and finish"
  - name: "Source reliability: labeled corpus"
    input: "A corpus of labeled observations across sherlock and maigret"
    expected: "Per-tool precision, recall, F1, FPR with LOW N flags where n is small"
    rubric:
      - "Reports per-tool metrics"
      - "Each metric includes tp, fp, fn, tn, n"
      - "Metrics flagged unreliable when n below threshold"
      - "Tools ranked by F1"
  - name: "Source reliability: empty corpus"
    input: "Run with a corpus that has no observations"
    expected: "Error with actionable guidance to build the corpus first"
    rubric:
      - "Reports an error, not metrics"
      - "Does not return P=1.0 or similar fabricated figures"
      - "actionable_guidance mentions building the corpus"
  - name: "Format flag: concise vs detailed"
    input: "Any new script with --format concise vs --format detailed"
    expected: "Concise emits one summary line; detailed emits full structured data"
    rubric:
      - "Both flags accepted"
      - "Concise: summary field present, compact output"
      - "Detailed: full structured data present"
